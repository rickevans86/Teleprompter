name: Android
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: >-
      ${{ fromJSON(github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/native-teleprompter')
          && '["self-hosted", "Linux", "X64"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        if: runner.environment == 'self-hosted'
      - name: Install target SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v5
        with:
          name: telepromptor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  ui-tests:
    runs-on: >-
      ${{ fromJSON(github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/native-teleprompter')
          && '["self-hosted", "Linux", "X64"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
        if: runner.environment == 'self-hosted'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM on the GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check KVM access on the self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::Android emulator tests need read and write access to /dev/kvm for the runner account."
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
