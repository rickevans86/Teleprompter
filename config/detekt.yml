build:
  maxIssues: 0

complexity:
  LongParameterList:
    ignoreAnnotated:
      - Composable
  LongMethod:
    ignoreAnnotated:
      - Composable
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    excludeGuardClauses: true
  MaxLineLength:
    maxLineLength: 140
